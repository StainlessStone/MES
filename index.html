<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>螺絲工廠戰情室</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ===== 主題變數：預設深色戰情室，html.light 為淺色 ===== */
:root{--bg:#0b1118;--panel:#131c27;--panel2:#1a2634;--line:#263547;--text:#e6edf5;--muted:#8a9bb0;--accent:#38bdf8}
html.light{--bg:#eef2f6;--panel:#ffffff;--panel2:#f1f5f9;--line:#d5dde7;--text:#16212e;--muted:#5d6f84;--accent:#0369a1}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:100%;color:var(--text)}
.inp:disabled{opacity:.6;cursor:not-allowed}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:600}
.btn.danger{border-color:#ef4444;color:#ef4444}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lamp{width:12px;height:12px;border-radius:50%;display:inline-block}
.lamp.blink{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.mcard{cursor:pointer;transition:border-color .15s}
.mcard:hover{border-color:var(--accent)}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lamp.blink{animation:none}}
</style>
</head>
<body class="min-h-screen">

<!-- ===== 登入頁 ===== -->
<div id="login" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="panel p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-1">螺絲工廠戰情室</h1>
    <p class="muted text-sm mb-5">機台監控雲端微系統（示範版，資料存於本機瀏覽器）</p>
    <label class="text-sm muted">帳號</label>
    <input id="lu" class="inp mb-3" autocomplete="username">
    <label class="text-sm muted">密碼</label>
    <input id="lp" type="password" class="inp mb-3" autocomplete="current-password">
    <p id="lerr" class="text-red-400 text-sm mb-2 hidden"></p>
    <button class="btn on w-full mb-5" onclick="doLogin()">登入</button>
    <p class="muted text-sm mb-2">快速切換測試帳號</p>
    <div class="grid grid-cols-1 gap-2">
      <button class="btn" onclick="quick('super')">以 總管理 登入</button>
      <button class="btn" onclick="quick('admin')">以 管理員 登入</button>
      <button class="btn" onclick="quick('user')">以 一般使用者 登入</button>
    </div>
  </div>
</div>

<!-- ===== 主畫面 ===== -->
<div id="app" class="hidden p-3 md:p-5 max-w-[2200px] mx-auto">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-xl md:text-2xl font-bold">螺絲工廠戰情室</h1>
      <p class="muted text-sm">目前身分：<span id="who"></span>　<span id="clock"></span></p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button id="simBtn" class="btn" onclick="toggleSim()">模擬產線運作：關</button>
      <button id="adminBtn" class="btn hidden" onclick="openAdmin()">系統管理</button>
      <button class="btn" onclick="toggleTheme()">深色 / 淺色</button>
      <button class="btn" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- 頂部總覽列 -->
  <section id="summary" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-4"></section>

  <!-- 篩選 -->
  <section class="flex flex-wrap gap-2 mb-4" id="filters"></section>

  <!-- 機台網格 -->
  <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-3"></section>
  <p id="empty" class="muted text-center py-10 hidden">沒有符合條件的機台，請調整篩選。</p>
  <p class="muted text-xs mt-6">示範系統：資料與權限僅在本機瀏覽器內運作，不同裝置之間不會同步。</p>
</div>

<!-- 彈出視窗 -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3" onclick="if(event.target===this)closeModal()">
  <div id="modalBody" class="panel p-5 w-full max-w-2xl max-h-[92vh] overflow-y-auto"></div>
</div>
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 panel px-4 py-2 z-[60] text-sm"></div>

<script>
/* ================= 常數與工具 ================= */
const ST = {
  normal:  {label:'正常', color:'#22c55e'},
  abnormal:{label:'異常', color:'#facc15'},
  stopped: {label:'停止', color:'#ef4444'},
  idle:    {label:'空機', color:'#94a3b8'}
};
const REASONS = ['待料','待模','待修','異常結單'];
const ROLES = {super:'總管理', admin:'管理員', user:'一般使用者'};
const K = {users:'sf_users', machines:'sf_machines', logs:'sf_logs', session:'sf_session', theme:'sf_theme'};
const WARN_RATIO = 0.9;   // 模具使用達壽命 90% 顯示警告
const SIM_SPEED = 10;     // 模擬時間加速倍數（讓數字變化肉眼可見）

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const fmt = n => Number(n).toLocaleString('en-US');
const load = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('儲存失敗：瀏覽器儲存空間不可用'); } };

/* ================= 資料層 ================= */
let users, machines, logs, me = null, simTimer = null;
let fType = 'all', fStatus = 'all';

function seedUsers(){
  return [
    {u:'super', p:'super123', role:'super'},
    {u:'admin', p:'admin123', role:'admin'},
    {u:'user',  p:'user123',  role:'user'}
  ];
}
// 產生 74 台機台：36 台打頭機 (H) + 38 台輾牙機 (R)
function seedMachines(){
  const list = [];
  const make = (prefix, type, n, rated) => {
    for(let i=1;i<=n;i++){
      const r = Math.random();
      const status = r<0.62?'normal': r<0.77?'abnormal': r<0.89?'stopped':'idle';
      const target = rnd(5,20)*1000;
      const moldLife = rnd(10,20)*1000;
      const idle = status==='idle';
      const output = idle?0:rnd(0,target);
      list.push({
        id: prefix+String(i).padStart(2,'0'), type, status,
        reason: status==='abnormal'?REASONS[rnd(0,3)]:'',
        output, target,
        mold: idle?0:Math.min(moldLife, rnd(0,moldLife)), moldLife,
        rated, ppm: status==='normal'?rnd(rated-15,rated+15):0
      });
    }
  };
  make('H','打頭機',36,110);
  make('R','輾牙機',38,160);
  return list;
}
function persist(){ save(K.machines, machines); }
function addLog(action){
  logs.unshift({t:new Date().toLocaleString('zh-TW',{hour12:false}), u:me?me.u:'system', a:action});
  logs = logs.slice(0,300);
  save(K.logs, logs);
}
function init(){
  users = load(K.users, null) || seedUsers(); save(K.users, users);
  machines = load(K.machines, null);
  if(!machines || machines.length!==74){ machines = seedMachines(); persist(); }
  logs = load(K.logs, []);
  if(load(K.theme,'dark')==='light') document.documentElement.classList.add('light');
  const s = load(K.session, null);
  me = s ? users.find(x=>x.u===s) || null : null;
  me ? showApp() : showLogin();
}

/* ================= 權限 ================= */
const canEdit  = () => me && (me.role==='super' || me.role==='admin');   // 狀態、原因、當前生產數
const canSuper = () => me && me.role==='super';                          // 目標值、模具壽命、帳號、重設

/* ================= 登入 / 登出 ================= */
function showLogin(){ $('login').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = me.u + '（' + ROLES[me.role] + '）';
  $('adminBtn').classList.toggle('hidden', !canSuper());
  render();
}
function doLogin(){
  const u = $('lu').value.trim(), p = $('lp').value;
  const f = users.find(x=>x.u===u && x.p===p);
  if(!f){ const e=$('lerr'); e.textContent='帳號或密碼錯誤，請重新輸入。'; e.classList.remove('hidden'); return; }
  loginAs(f);
}
function quick(role){ loginAs(users.find(x=>x.role===role) || seedUsers().find(x=>x.role===role)); }
function loginAs(u){ me=u; save(K.session,u.u); addLog('登入'); $('lerr').classList.add('hidden'); showApp(); }
function logout(){ addLog('登出'); stopSim(); me=null; localStorage.removeItem(K.session); showLogin(); }
function toggleTheme(){
  const l = document.documentElement.classList.toggle('light');
  save(K.theme, l?'light':'dark');
}

/* ================= 渲染 ================= */
function counts(){
  const c = {normal:0,abnormal:0,stopped:0,idle:0};
  machines.forEach(m=>c[m.status]++);
  return c;
}
function renderSummary(){
  const c = counts(), total = machines.length;
  const util = (c.normal/total*100).toFixed(1); // 綜合稼動率 = 正常運轉機台 ÷ 總機台
  const h = machines.filter(m=>m.type==='打頭機').length;
  let html = `<div class="panel p-3"><div class="muted text-sm">總機台數</div>
    <div class="text-3xl font-bold">${total}</div>
    <div class="muted text-xs">打頭機 ${h} ／ 輾牙機 ${total-h}</div></div>`;
  for(const k of ['normal','abnormal','stopped','idle']){
    html += `<div class="panel p-3"><div class="muted text-sm flex items-center gap-2">
      <span class="lamp" style="background:${ST[k].color}"></span>${ST[k].label}</div>
      <div class="text-3xl font-bold">${c[k]}</div>
      <div class="muted text-xs">${(c[k]/total*100).toFixed(1)}%</div></div>`;
  }
  html += `<div class="panel p-3" style="border-color:var(--accent)"><div class="muted text-sm">全廠綜合稼動率</div>
    <div class="text-3xl font-bold" style="color:var(--accent)">${util}%</div>
    <div class="muted text-xs">正常運轉 ÷ 總機台</div></div>`;
  $('summary').innerHTML = html;
}
function renderFilters(){
  const types = [['all','全部機台'],['打頭機','打頭機'],['輾牙機','輾牙機']];
  const sts = [['all','全部狀態'],...Object.entries(ST).map(([k,v])=>[k,v.label])];
  $('filters').innerHTML =
    types.map(([v,l])=>`<button class="btn ${fType===v?'on':''}" onclick="fType='${v}';render()">${l}</button>`).join('') +
    '<span class="mx-2 border-l" style="border-color:var(--line)"></span>' +
    sts.map(([v,l])=>`<button class="btn ${fStatus===v?'on':''}" onclick="fStatus='${v}';render()">${l}</button>`).join('');
}
function ring(pct, color){
  const r=28, c=2*Math.PI*r, off=c*(1-Math.min(1,pct/100));
  return `<svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="生產進度 ${Math.round(pct)}%">
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 36 36)"/>
    <text x="36" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${Math.round(pct)}%</text></svg>`;
}
function card(m){
  const s = ST[m.status];
  const pct = m.target ? m.output/m.target*100 : 0;
  const mp = m.moldLife ? m.mold/m.moldLife : 0;
  const mcolor = mp>=1?'#ef4444': mp>=WARN_RATIO?'#facc15':'#38bdf8';
  const warn = mp>=1 ? '模具已達壽命，請更換' : mp>=WARN_RATIO ? '模具接近壽命' : '';
  return `<article class="panel mcard p-3" onclick="openMachine('${m.id}')" tabindex="0"
      onkeydown="if(event.key==='Enter')openMachine('${m.id}')" aria-label="機台 ${m.id}">
    <div class="flex items-center justify-between mb-2">
      <div class="font-bold text-lg">${m.id} <span class="muted text-xs font-normal">${m.type}</span></div>
      <div class="flex items-center gap-2 text-sm">
        <span class="lamp ${m.status==='abnormal'?'blink':''}" style="background:${s.color};box-shadow:0 0 8px ${s.color}"></span>
        <span>${s.label}${m.status==='abnormal'&&m.reason?'：'+m.reason:''}</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      ${ring(pct,s.color)}
      <div class="text-sm flex-1 min-w-0">
        <div class="muted text-xs">生產進度</div>
        <div class="font-semibold">${fmt(m.output)} / ${fmt(m.target)}</div>
        <div class="muted text-xs mt-1">每分鐘產量 PPM</div>
        <div class="font-semibold text-lg" style="color:var(--accent)">${m.ppm}</div>
      </div>
    </div>
    <div class="mt-3 text-sm">
      <div class="flex justify-between"><span class="muted text-xs">模具使用</span>
        <span class="font-semibold">${fmt(m.mold)} / ${fmt(m.moldLife)}</span></div>
      <div class="h-2 rounded mt-1" style="background:var(--line)">
        <div class="h-2 rounded" style="width:${Math.min(100,mp*100)}%;background:${mcolor}"></div></div>
      ${warn?`<div class="text-xs mt-1" style="color:${mcolor}">⚠ ${warn}</div>`:''}
    </div>
  </article>`;
}
function renderGrid(){
  const list = machines.filter(m=>(fType==='all'||m.type===fType)&&(fStatus==='all'||m.status===fStatus));
  $('grid').innerHTML = list.map(card).join('');
  $('empty').classList.toggle('hidden', list.length>0);
}
function render(){ renderSummary(); renderFilters(); renderGrid(); }

/* ================= 機台明細 / 編輯視窗 ================= */
function openMachine(id){
  const m = machines.find(x=>x.id===id); if(!m) return;
  const ed = canEdit(), su = canSuper();
  const dis = b => b ? '' : 'disabled';
  $('modalBody').innerHTML = `
    <h2 class="text-xl font-bold mb-1">機台 ${m.id}（${m.type}）</h2>
    <p class="muted text-sm mb-4">${ed?'可修改欄位如下；灰色欄位需總管理權限。':'唯讀檢視：您的身分無修改權限。'}</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="text-sm muted">機台狀態</label>
        <select id="fs" class="inp" ${dis(ed)} onchange="$('fr').disabled=this.value!=='abnormal'||!${ed}">
          ${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${m.status===k?'selected':''}>${v.label}</option>`).join('')}
        </select></div>
      <div><label class="text-sm muted">異常原因（僅異常狀態）</label>
        <select id="fr" class="inp" ${ed&&m.status==='abnormal'?'':'disabled'}>
          ${REASONS.map(r=>`<option ${m.reason===r?'selected':''}>${r}</option>`).join('')}
        </select></div>
      <div><label class="text-sm muted">當前生產數</label>
        <input id="fo" type="number" min="0" class="inp" value="${m.output}" ${dis(ed)}></div>
      <div><label class="text-sm muted">目標產量</label>
        <input id="ft" type="number" min="1" class="inp" value="${m.target}" ${dis(su)}></div>
      <div><label class="text-sm muted">模具已使用數</label>
        <input id="fm" type="number" min="0" class="inp" value="${m.mold}" ${dis(su)}></div>
      <div><label class="text-sm muted">模具壽命目標</label>
        <input id="fl" type="number" min="1" class="inp" value="${m.moldLife}" ${dis(su)}></div>
    </div>
    <p id="merr" class="text-red-400 text-sm mt-3 hidden"></p>
    <div class="flex justify-end gap-2 mt-5">
      <button class="btn" onclick="closeModal()">${ed?'取消':'關閉'}</button>
      ${ed?`<button class="btn on" onclick="saveMachine('${m.id}')">儲存變更</button>`:''}
    </div>`;
  $('modal').classList.remove('hidden');
}
function saveMachine(id){
  const m = machines.find(x=>x.id===id);
  if(!canEdit()) return;                                   // 權限防護
  const status = $('fs').value, reason = status==='abnormal' ? $('fr').value : '';
  const output = parseInt($('fo').value,10);
  let target = m.target, mold = m.mold, life = m.moldLife;
  if(canSuper()){
    target = parseInt($('ft').value,10); mold = parseInt($('fm').value,10); life = parseInt($('fl').value,10);
  }
  const bad = [output,target,mold,life].some(n=>isNaN(n)||n<0) || target<1 || life<1;
  if(bad){ const e=$('merr'); e.textContent='請輸入有效的非負整數（目標與壽命需大於 0）。'; e.classList.remove('hidden'); return; }
  const before = `${ST[m.status].label}${m.reason?'/'+m.reason:''} 產量${m.output}`;
  Object.assign(m,{status,reason,output,target,mold,moldLife:life});
  if(status!=='normal') m.ppm = 0;
  else if(m.ppm===0) m.ppm = rnd(m.rated-15, m.rated+15);
  persist(); addLog(`修改機台 ${m.id}：${before} → ${ST[status].label}${reason?'/'+reason:''} 產量${output}`);
  closeModal(); render(); toast(`機台 ${m.id} 已儲存`);
}
function closeModal(){ $('modal').classList.add('hidden'); }

/* ================= 系統管理（僅總管理） ================= */
function openAdmin(){
  if(!canSuper()) return;
  const byType = t => { const l=machines.filter(m=>m.type===t);
    return `<tr><td class="py-1">${t}</td><td>${l.length}</td><td>${fmt(l.reduce((a,m)=>a+m.output,0))}</td>
      <td>${l.filter(m=>m.status==='normal').length}</td><td>${l.filter(m=>m.mold>=m.moldLife*WARN_RATIO).length}</td></tr>`; };
  $('modalBody').innerHTML = `
    <div class="flex justify-between items-center mb-3"><h2 class="text-xl font-bold">系統管理</h2>
      <button class="btn" onclick="closeModal()">關閉</button></div>

    <h3 class="font-semibold mb-1">報表摘要</h3>
    <table class="w-full text-sm mb-2"><thead class="muted text-left"><tr><th>類型</th><th>台數</th><th>累計生產數</th><th>正常台數</th><th>模具警告台數</th></tr></thead>
      <tbody>${byType('打頭機')}${byType('輾牙機')}</tbody></table>
    <button class="btn mb-5" onclick="exportCsv()">匯出機台報表 CSV</button>

    <h3 class="font-semibold mb-1">帳號管理</h3>
    <div class="mb-2">${users.map(u=>`<div class="flex justify-between items-center py-1 border-b" style="border-color:var(--line)">
      <span>${esc(u.u)} <span class="muted text-sm">（${ROLES[u.role]}）</span></span>
      ${u.u===me.u?'<span class="muted text-xs">目前登入</span>':`<button class="btn danger" onclick="delUser('${esc(u.u)}')">刪除</button>`}</div>`).join('')}</div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
      <input id="nu" class="inp" placeholder="新帳號">
      <input id="np" class="inp" placeholder="密碼">
      <select id="nr" class="inp"><option value="admin">管理員</option><option value="user">一般使用者</option><option value="super">總管理</option></select>
      <button class="btn on" onclick="addUser()">新增帳號</button></div>
    <p id="aerr" class="text-red-400 text-sm mb-3 hidden"></p>

    <h3 class="font-semibold mb-1">系統日誌（最近 50 筆）</h3>
    <div class="text-xs max-h-48 overflow-y-auto panel p-2 mb-5" style="background:var(--panel2)">
      ${logs.slice(0,50).map(l=>`<div class="py-0.5"><span class="muted">${esc(l.t)}</span> ${esc(l.u)}：${esc(l.a)}</div>`).join('')||'<span class="muted">尚無紀錄</span>'}</div>

    <h3 class="font-semibold mb-1">全廠資料重設</h3>
    <p class="muted text-sm mb-2">會重新產生 74 台機台的模擬資料並清除日誌，帳號保留。</p>
    <button class="btn danger" onclick="resetAll()">重設全廠資料</button>`;
  $('modal').classList.remove('hidden');
}
function addUser(){
  const u=$('nu').value.trim(), p=$('np').value, role=$('nr').value, e=$('aerr');
  if(!u||!p){ e.textContent='帳號與密碼皆不可空白。'; e.classList.remove('hidden'); return; }
  if(users.some(x=>x.u===u)){ e.textContent='此帳號已存在，請換一個名稱。'; e.classList.remove('hidden'); return; }
  users.push({u,p,role}); save(K.users,users); addLog(`新增帳號 ${u}（${ROLES[role]}）`); openAdmin();
}
function delUser(u){
  if(!canSuper()||u===me.u) return;
  if(!confirm(`確定刪除帳號 ${u}？`)) return;
  users = users.filter(x=>x.u!==u); save(K.users,users); addLog(`刪除帳號 ${u}`); openAdmin();
}
function resetAll(){
  if(!confirm('確定重設全廠資料？此動作無法復原。')) return;
  machines = seedMachines(); persist(); logs=[]; save(K.logs,logs); addLog('全廠資料重設');
  closeModal(); render(); toast('已重設全廠資料');
}
function exportCsv(){
  const head = ['機台','類型','狀態','異常原因','當前生產數','目標產量','進度%','模具使用數','模具壽命','PPM'];
  const rows = machines.map(m=>[m.id,m.type,ST[m.status].label,m.reason,m.output,m.target,(m.output/m.target*100).toFixed(1),m.mold,m.moldLife,m.ppm]);
  const csv = '\ufeff' + [head,...rows].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'machine_report.csv'; a.click(); addLog('匯出報表 CSV');
}

/* ================= 即時模擬 ================= */
function toggleSim(){ simTimer ? stopSim() : startSim(); }
function startSim(){ simTimer = setInterval(simTick, 3000); $('simBtn').textContent='模擬產線運作：開'; $('simBtn').classList.add('on'); }
function stopSim(){ clearInterval(simTimer); simTimer=null; const b=$('simBtn'); if(b){ b.textContent='模擬產線運作：關'; b.classList.remove('on'); } }
function simTick(){
  machines.forEach(m=>{
    if(m.status!=='normal' || Math.random()>0.4) return;      // 只有正常機台、且隨機約 40% 更新
    m.ppm = Math.max(10, m.rated + rnd(-15,15));
    const add = Math.round(m.ppm*3/60*SIM_SPEED);
    m.output = Math.min(m.target, m.output+add);
    m.mold = Math.min(m.moldLife, m.mold+add);
    if(m.mold>=m.moldLife){ m.status='abnormal'; m.reason='待模'; m.ppm=0; }   // 模具到壽命 → 待模
    else if(m.output>=m.target){ m.status='idle'; m.reason=''; m.ppm=0; }       // 達標 → 空機
  });
  persist(); render();
}

/* ================= 其他 ================= */
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.add('hidden'),2200); }
setInterval(()=>{ const c=$('clock'); if(c) c.textContent=new Date().toLocaleString('zh-TW',{hour12:false}); },1000);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&!$('login').classList.contains('hidden')) doLogin(); });
init();
</script>
